name: outfit-review
services:
  db:
    image: postgres:16
    container_name: outfit-review-db
    environment:
      POSTGRES_PASSWORD: outfit-local-test-only
      POSTGRES_DB: outfit
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d outfit"]
      interval: 2s
      timeout: 3s
      retries: 20
  auth:
    image: supabase/gotrue:v2.196.0
    container_name: outfit-review-auth
    ports: ["127.0.0.1:54338:9999"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54337/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:outfit-local-test-only@db:5432/outfit?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: outfit-local-integration-fake-key-never-use-in-production
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54337/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: error
  rest:
    image: postgrest/postgrest:v14.17
    container_name: outfit-review-rest
    ports: ["127.0.0.1:54339:3000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:outfit-local-test-only@db:5432/outfit
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: outfit-local-integration-fake-key-never-use-in-production
      PGRST_LOG_LEVEL: error
